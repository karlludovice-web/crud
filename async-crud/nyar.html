<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Async JavaScript CRUD</title>

    <link rel="stylesheet" href="stayl.css">

</head>

<body>

    <div class="container">

        <h1>Async JavaScript CRUD</h1>

        <p class="subtitle">
            CRUD using HTML, CSS, JavaScript, Fetch API, PHP and MySQL
        </p>

        <div class="form-container">

            <h2 id="formTitle">
                Add Record
            </h2>

            <form id="crudForm">

                <input
                    type="hidden"
                    id="recordId"
                >


                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter title"
                    required
                >


                <label for="userId">
                    User ID
                </label>

                <input
                    type="number"
                    id="userId"
                    placeholder="Enter user ID"
                    min="1"
                    required
                >


                <div class="form-buttons">

                    <button
                        type="submit"
                        id="submitButton"
                    >
                        Add Record
                    </button>


                    <button
                        type="button"
                        id="cancelButton"
                        onclick="cancelEdit()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>

        <div id="status"></div>

        <div class="records-container">

            <div class="records-header">

                <h2>
                    Records
                </h2>

                <button
                    type="button"
                    onclick="getRecords()"
                >
                    Refresh
                </button>

            </div>


            <div id="loading">
                Loading...
            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>User ID</th>

                            <th>Title</th>

                            <th>Completed</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="recordsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
